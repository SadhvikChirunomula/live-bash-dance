name: Preview

# Comments on pull requests that touch anims/* with a still frame of each changed
# animation. Uses pull_request_target so it can comment on PRs from forks; for that
# reason it never checks out or runs code from the PR. It only reads text files
# through the API and quotes them inside a code block.
on:
  pull_request_target:
    paths:
      - "anims/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const MARKER = "<!-- live-bash-dance-preview -->";
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const head = { owner: pr.head.repo.owner.login, repo: pr.head.repo.name, ref: pr.head.sha };

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            const names = [...new Set(files
              .filter((f) => f.status !== "removed")
              .map((f) => f.filename.match(/^anims\/([a-z0-9][a-z0-9-]*)\//)?.[1])
              .filter(Boolean))].sort();

            const read = async (path) => {
              try {
                const { data } = await github.rest.repos.getContent({ ...head, path });
                return Buffer.from(data.content, "base64").toString("utf8");
              } catch { return null; }
            };

            const sections = [];
            for (const name of names.slice(0, 10)) {
              const metaText = await read(`anims/${name}/meta.json`);
              if (!metaText) { sections.push(`### \`${name}\`\n\nNo \`meta.json\` found.`); continue; }
              let meta;
              try { meta = JSON.parse(metaText); } catch { sections.push(`### \`${name}\`\n\n\`meta.json\` is not valid JSON.`); continue; }
              const sizes = Array.isArray(meta.sizes) ? meta.sizes : [];
              const smallest = sizes.map((s) => Number(s.width)).filter(Number.isInteger).sort((a, b) => a - b)[0];
              const text = smallest && await read(`anims/${name}/${smallest}.txt`);
              const frames = text ? text.replace(/\n+$/, "").split("\n@@FRAME@@\n") : [];
              // Letters and spaces only, so nothing in the frame can break out of the code block.
              const frame = (frames[Math.floor(frames.length / 2)] ?? "").replace(/[^A-Za-z \n]/g, "?");
              const clean = (s) => String(s ?? "").replace(/[^\w .,:;()'\/-]/g, "").slice(0, 120) || "(missing)";
              sections.push([
                `### \`${name}\` — ${clean(meta.title)}`,
                "",
                `${frames.length} frames · ${clean(meta.fps)} fps · sizes ${sizes.map((s) => `${Number(s.width)}x${Number(s.height)}`).join(", ") || "(none)"}`,
                `credit: ${clean(meta.credit)} · license: ${clean(meta.license)}`,
                "",
                frame ? "```text\n" + frame + "\n```" : `Could not read \`${smallest ?? "?"}.txt\`.`,
              ].join("\n"));
            }
            if (names.length > 10) sections.push(`…and ${names.length - 10} more.`);
            if (!sections.length) return;

            const body = [MARKER, "## Animation preview", "", "Middle frame of the smallest size of each changed animation:", "", ...sections].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
            const mine = comments.find((c) => c.user?.type === "Bot" && c.body?.startsWith(MARKER));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
